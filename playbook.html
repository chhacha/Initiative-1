<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Incident Response Playbook | Loss of Primary Power Supply</title>

<!-- Fonts: Inter from Google Fonts (only external dependency) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- React via CDN + Babel standalone for JSX (no build step) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --bg:#0E0F1A;
    --sidebar:#13152A;
    --card:#1A1D35;
    --card-border:#2C2D65;
    --purple:#5B4B8A;
    --purple-mid:#6E5CA8;
    --purple-light:#8A79C4;
    --orange:#F58B1F;
    --red:#E71C57;
    --amber:#E65100;
    --green:#2E7D32;
    --text:#FFFFFF;
    --muted:#9A9AB0;
    --sidebar-w:280px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  #root{height:100%;}

  /* ---------- App shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;
    height:60px;flex:0 0 60px;
    background:var(--sidebar);
    border-bottom:1px solid var(--card-border);
    padding:0 20px;gap:16px;
    z-index:30;
  }
  .topbar-left{display:flex;align-items:center;min-width:var(--sidebar-w);}
  .app-name{font-weight:600;font-size:16px;letter-spacing:.3px;color:#fff;}
  .topbar-center{flex:1;text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;font-weight:500;}
  .topbar-right{
    display:flex;align-items:center;gap:14px;justify-content:flex-end;
    min-width:var(--sidebar-w);
  }
  .scenario-pill{
    font-size:12px;color:var(--text);font-weight:500;
    border:1px solid var(--card-border);border-left:3px solid var(--orange);
    background:var(--card);border-radius:6px;padding:5px 11px;white-space:nowrap;
  }
  .glossary-btn{
    background:var(--purple);border:none;color:#fff;font-family:inherit;
    font-size:12px;font-weight:600;letter-spacing:.5px;
    padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;
    transition:background .12s;
  }
  .glossary-btn:hover{background:var(--purple-mid);}
  .hamburger{
    display:none;background:none;border:none;color:var(--text);
    font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;
  }

  /* ---------- Body row ---------- */
  .body-row{display:flex;flex:1;min-height:0;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
    background:var(--sidebar);
    border-right:1px solid var(--card-border);
    overflow-y:auto;padding:18px 0 40px;
    z-index:20;
  }
  .sidebar-section-label{
    color:var(--orange);font-size:10px;font-weight:600;letter-spacing:1.8px;
    padding:6px 22px;margin-top:4px;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:9px 22px;cursor:pointer;
    color:var(--muted);font-size:13px;font-weight:500;
    border-left:3px solid transparent;
    transition:background .12s ease,color .12s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,.03);color:var(--text);}
  .nav-item.active{
    color:var(--text);background:rgba(91,75,138,.18);
    border-left:3px solid var(--orange);
  }
  .nav-num{
    color:var(--muted);font-size:11px;font-weight:600;
    min-width:18px;font-variant-numeric:tabular-nums;
  }
  .nav-item.active .nav-num{color:var(--orange);}

  /* ---------- Main content ---------- */
  .main{flex:1;min-width:0;overflow-y:auto;padding:32px 40px 80px;}
  .main-inner{max-width:920px;margin:0 auto;}

  .page-eyebrow{color:var(--orange);font-size:11px;font-weight:600;letter-spacing:2px;margin-bottom:6px;}
  .page-title{font-size:26px;font-weight:600;margin:0 0 10px;letter-spacing:.2px;}
  .scenario-badge{
    display:inline-block;font-size:11px;font-weight:600;letter-spacing:1px;
    color:var(--orange);text-transform:uppercase;
    border:1px solid var(--card-border);border-radius:6px;
    background:rgba(245,139,31,.07);padding:5px 11px;margin-bottom:22px;
  }

  /* ---------- Cards / chapter blocks ---------- */
  .card{
    background:var(--card);border:1px solid var(--card-border);
    border-radius:8px;padding:22px 24px;margin-bottom:16px;
  }
  .section-label{color:var(--orange);font-size:11px;font-weight:600;letter-spacing:1.6px;margin:0 0 12px;}
  .block-h{font-size:14px;font-weight:600;color:var(--text);margin:16px 0 8px;}
  .block-h:first-child{margin-top:0;}
  .block-p{color:var(--muted);font-size:14px;margin:0 0 10px;}
  .block-p b{color:var(--text);font-weight:600;}
  ul.block-ul{margin:0 0 10px;padding:0;list-style:none;}
  ul.block-ul li{color:var(--muted);font-size:14px;padding:5px 0 5px 18px;position:relative;}
  ul.block-ul li::before{
    content:"";position:absolute;left:2px;top:12px;
    width:5px;height:5px;border-radius:50%;background:var(--purple);
  }
  ul.block-ul li b{color:var(--text);font-weight:600;}
  .note-box{
    border:1px solid var(--card-border);border-left:3px solid var(--orange);
    background:rgba(245,139,31,.06);border-radius:6px;
    padding:12px 16px;margin:6px 0 10px;color:var(--text);font-size:13px;
  }

  /* ---------- Detection source cards (Ch 02) ---------- */
  .detect-grid{display:flex;gap:14px;margin:4px 0 6px;}
  .detect-card{
    flex:1;background:var(--bg);border:1px solid var(--card-border);
    border-left:3px solid var(--orange);border-radius:8px;padding:16px;
  }
  .detect-icon{
    width:34px;height:34px;border-radius:8px;background:rgba(245,139,31,.12);
    display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--orange);
  }
  .detect-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .detect-text{font-size:13px;color:var(--muted);}

  /* ---------- Triage checklist (Ch 02) ---------- */
  .checklist{margin:4px 0 4px;}
  .check-item{
    display:flex;align-items:flex-start;gap:12px;
    border:1px solid var(--card-border);border-radius:6px;background:var(--bg);
    padding:11px 14px;margin-bottom:8px;cursor:pointer;user-select:none;
    transition:border-color .12s;
  }
  .check-item:hover{border-color:var(--purple);}
  .check-box{
    flex:0 0 auto;width:20px;height:20px;border-radius:5px;
    border:1px solid var(--card-border);background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;margin-top:1px;transition:background .12s,border-color .12s;
  }
  .check-item.checked .check-box{background:var(--green);border-color:var(--green);}
  .check-text{font-size:13px;color:var(--text);}
  .check-item.checked .check-text{color:var(--muted);text-decoration:line-through;}

  /* ---------- Severity / status (Ch 02) ---------- */
  .sev-row{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-top:1px solid var(--card-border);}
  .sev-row:first-of-type{border-top:none;}
  .sev-tag{
    flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:.5px;color:#fff;
    border-radius:6px;padding:4px 10px;min-width:34px;text-align:center;
  }
  .sev-tag.p1{background:var(--red);}
  .sev-tag.p2{background:var(--amber);}
  .sev-tag.p3{background:var(--green);}
  .sev-text{font-size:13px;color:var(--muted);}
  .sev-text b{color:var(--text);font-weight:600;}

  /* ---------- Status dot (escalation tree) ---------- */
  .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;}
  .dot.green{background:var(--green);}
  .dot.amber{background:var(--orange);}
  .dot.red{background:var(--red);}
  .dot.muted{background:var(--purple);}

  /* ---------- Escalation tree (inside Ch 03) ---------- */
  .tree-sub-label{color:var(--orange);font-size:11px;font-weight:600;letter-spacing:1.6px;margin:4px 0 4px;}
  .tree-title{font-size:16px;font-weight:600;color:var(--text);margin:0 0 4px;}
  .tree-intro{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .tree-legend{display:flex;gap:18px;margin:0 0 16px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
  .tree-controls{display:flex;gap:10px;margin-bottom:16px;}
  .tree-btn{
    background:var(--card);border:1px solid var(--card-border);color:var(--muted);
    font-family:inherit;font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:6px;cursor:pointer;transition:border-color .12s,color .12s;
  }
  .tree-btn:hover{border-color:var(--purple);color:var(--text);}

  .node{margin-bottom:10px;}
  .node-card{background:var(--card);border:1px solid var(--card-border);border-radius:8px;overflow:hidden;}
  .node-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;}
  .node-head:hover{background:rgba(255,255,255,.02);}
  .node-titlewrap{flex:1;min-width:0;}
  .node-title{font-size:15px;font-weight:600;color:var(--text);}
  .node-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .expand-btn{
    flex:0 0 auto;width:30px;height:30px;border-radius:6px;
    border:1px solid var(--card-border);background:var(--bg);
    color:var(--muted);font-size:18px;font-weight:500;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:border-color .12s,color .12s,background .12s;
  }
  .node-head:hover .expand-btn{border-color:var(--orange);color:var(--orange);}
  .expand-btn.open{background:var(--purple);border-color:var(--purple);color:#fff;}
  .node-drawer{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .node-drawer.open{max-height:6000px;}
  .node-body{padding:0 18px 16px;border-top:1px solid var(--card-border);}
  .actions-label{color:var(--orange);font-size:10px;font-weight:600;letter-spacing:1.4px;margin:14px 0 10px;}
  .action{border:1px solid var(--card-border);border-radius:6px;padding:11px 14px;margin-bottom:8px;background:var(--bg);}
  .action-text{font-size:13px;color:var(--text);font-weight:500;margin-bottom:8px;line-height:1.45;}
  .action-meta{display:flex;flex-wrap:wrap;gap:10px 26px;}
  .meta-col{display:flex;flex-direction:column;}
  .meta-label{font-size:9px;letter-spacing:1px;color:var(--orange);font-weight:600;text-transform:uppercase;margin-bottom:2px;}
  .meta-role{font-size:12px;color:var(--text);font-weight:500;}
  .meta-line{font-size:12px;color:var(--muted);}
  .children-label{color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1.4px;margin:18px 0 10px;}
  .children{margin-left:20px;padding-left:18px;border-left:1px solid var(--card-border);}

  /* ---------- System owner contact cards (Ch 05) ---------- */
  .owner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0;}
  .owner-card{
    background:var(--card);border:1px solid var(--purple);border-radius:8px;
    padding:14px;cursor:pointer;transition:border-color .12s;
  }
  .owner-card:hover{border-color:var(--purple-light);}
  .owner-head{display:flex;align-items:center;gap:10px;}
  .owner-avatar{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    background:var(--purple);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:#fff;
  }
  .owner-role{font-size:13px;font-weight:600;color:#fff;flex:1;}
  .owner-toggle{font-size:16px;color:var(--muted);}
  .owner-details{margin-top:12px;padding-top:12px;border-top:1px solid var(--card-border);display:flex;flex-direction:column;gap:5px;}
  .owner-line{font-size:12px;color:var(--muted);}
  .owner-line b{color:var(--text);font-weight:600;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:1px;}

  /* ---------- Recovery timeline (Ch 07) ---------- */
  .timeline-wrap{margin:4px 0 6px;}
  .timeline-marks{display:flex;justify-content:space-between;margin-bottom:8px;}
  .timeline-mark{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .timeline-bar{height:3px;background:var(--card-border);border-radius:2px;margin-bottom:16px;}
  .phase-row{display:flex;align-items:stretch;gap:0;}
  .phase-block{
    flex:1;border-radius:8px;padding:12px 10px;cursor:pointer;color:#fff;
    border:1px solid transparent;transition:transform .1s,filter .12s;text-align:center;
  }
  .phase-block:hover{filter:brightness(1.12);}
  .phase-block.active{border-color:var(--orange);}
  .phase-label{font-size:12px;font-weight:600;display:block;}
  .phase-range{font-size:10px;opacity:.85;display:block;margin-top:2px;}
  .gate{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:46px;color:var(--orange);
  }
  .gate-dot{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--orange);
    background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;
  }
  .gate-label{font-size:8px;font-weight:600;letter-spacing:.8px;margin-top:3px;}
  .phase-detail{
    margin-top:14px;border:1px solid var(--card-border);border-left:3px solid var(--orange);
    border-radius:6px;background:var(--bg);padding:14px 16px;
  }
  .phase-detail-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:8px;}
  .phase-approver{font-size:12px;color:var(--orange);margin-top:8px;}
  .timeline-foot{font-size:12px;color:var(--muted);margin-top:14px;font-style:italic;}

  /* ---------- Glossary modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:flex-end;}
  .modal-panel{
    width:420px;max-width:90vw;height:100%;background:var(--sidebar);
    border-left:1px solid var(--card-border);overflow-y:auto;
    animation:slidein .2s ease;
  }
  @keyframes slidein{from{transform:translateX(30px);opacity:.4;}to{transform:translateX(0);opacity:1;}}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--purple);padding:16px 20px;position:sticky;top:0;
  }
  .modal-head h2{margin:0;font-size:16px;font-weight:600;color:#fff;}
  .modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0 4px;}
  .modal-body{padding:16px 20px 40px;}
  .glossary-term{padding:11px 0;border-bottom:1px solid var(--card-border);}
  .glossary-term:last-child{border-bottom:none;}
  .glossary-acro{font-size:13px;font-weight:600;color:#fff;}
  .glossary-def{font-size:13px;color:var(--muted);margin-top:2px;}

  /* ---------- Mobile ---------- */
  .overlay{display:none;}
  @media (max-width:768px){
    .topbar-left{min-width:auto;}
    .topbar-center{display:none;}
    .topbar-right{min-width:auto;}
    .scenario-pill{font-size:10px;padding:4px 8px;}
    .hamburger{display:block;}
    .sidebar{position:fixed;top:60px;left:0;bottom:0;transform:translateX(-100%);transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .overlay.show{display:block;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,.5);z-index:15;}
    .main{padding:22px 18px 60px;}
    .detect-grid{flex-direction:column;}
    .owner-grid{grid-template-columns:1fr;}
    .phase-row{flex-direction:column;gap:8px;}
    .gate{flex-direction:row;width:auto;gap:8px;padding:2px 0;}
    .children{margin-left:8px;padding-left:12px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useCallback } = React;

const SCENARIO = "Loss of Primary Power Supply";
const TBC_NAME  = "[Name TBC]";
const TBC_PHONE = "[+971 XX XXX XXXX]";
const TBC_EMAIL = "[email@dubaiairports.ae]";

/* =========================================================================
   GLOSSARY
   ========================================================================= */
const GLOSSARY = [
  ["ATC","Air Traffic Control. The service managing aircraft movement on the ground and in airspace"],
  ["ANSP","Air Navigation Service Provider. The organization that operates ATC"],
  ["BMS","Building Management System. The airport's central monitoring system for physical infrastructure including power and cooling"],
  ["Bronze tier","The IT technical response team. First to activate in any incident"],
  ["CRAC","Computer Room Air Conditioning. The cooling units in the data center"],
  ["CCTV","Closed-Circuit Television. The security camera system"],
  ["DCS","Departure Control System. The IT system managing flight departures"],
  ["DR","Disaster Recovery. The process of switching IT services to a backup site"],
  ["Gold tier","Executive leadership (CEO, COO, CFO). Activated only for highest-severity decisions"],
  ["NOC","Network Operations Center. The IT team monitoring all systems 24/7"],
  ["SCADA","Supervisory Control and Data Acquisition. Industrial monitoring for power distribution equipment"],
  ["Silver tier","Cross-functional response team including all system owners, airlines, and operational stakeholders"],
  ["UPS","Uninterruptible Power Supply. Battery system that bridges the gap between grid power loss and generator startup (10 to 30 minutes)"]
];

/* =========================================================================
   DETECTION CARDS, TRIAGE, SEVERITY (Ch 02)
   ========================================================================= */
const DETECTION = [
  {icon:"monitor", title:"NOC Dashboards", text:"Mass service degradation visible in monitoring tools (Dynatrace, Datadog or equivalent). Services drop off the network almost immediately."},
  {icon:"bell", title:"BMS / SCADA Alert", text:"Building Management System and SCADA send power failure alerts to the Facilities Control Room. NOC receives a notification from Facilities."},
  {icon:"phone", title:"Direct Notification", text:"Facilities team or Terminal Operations calls NOC directly to report power loss."}
];

const TRIAGE = [
  "Confirm power loss is not isolated to a single system or zone",
  "Confirm generator status via Facilities Control Room",
  "Identify which Tier 1 IT systems are showing degradation on the NOC dashboard",
  "Estimate likely duration based on available information (grid failure vs physical damage)",
  "Determine severity level based on the criteria below"
];

const SEVERITY = [
  {tag:"P3", cls:"p3", text:"Single IT system or zone affected, generator confirmed running, no Tier 1 system impacted. IT monitors"},
  {tag:"P2", cls:"p2", text:"Multiple IT systems affected, generator status unclear, at least one Tier 2 system impacted. Bronze team reviews"},
  {tag:"P1", cls:"p1", text:"Data center at risk, Tier 1 system degrading, or full campus impact confirmed. Bronze team activates immediately"}
];

/* =========================================================================
   SYSTEM OWNER CONTACT CARDS (Ch 05)
   ========================================================================= */
const OWNERS = [
  ["CCTV System Owner","Contact immediately on P1 to confirm power status of all CCTV zones and flag any that are dark"],
  ["ATC Comms Interface Owner","Contact immediately on P1 to confirm the ATC interface status"],
  ["Network Lead","Contact immediately on P1 to confirm core network backbone status"],
  ["Infrastructure Lead / Data Center","Contact immediately on P1 to confirm cooling status and DR failover readiness"],
  ["NOC Manager","Contact immediately on P1 to confirm the full service status map"],
  ["DCS System Owner","Contact within 30 minutes to confirm Departure Control System status"],
  ["Baggage Systems Owner","Contact within 30 minutes to confirm baggage handling status"],
  ["Terminal IT / Passenger Displays","Contact within 30 minutes to confirm display status"],
  ["Ground Handling IT Liaison","Contact within 30 minutes to confirm comms status with ground teams"]
];

/* =========================================================================
   RECOVERY TIMELINE (Ch 07)
   ========================================================================= */
const TIMELINE_MARKS = ["T+0","T+30min","T+1h","T+2h","T+4h","T+6h","T+8h+"];
const PHASES = [
  {label:"Phase 0", range:"T+0", color:"#13152A", title:"Power stability gate",
   systems:["Confirm power is stable","Bronze team lead go/no-go decision","No IT recovery begins until this gate is cleared"], approver:"Bronze team lead"},
  {label:"Phase 1", range:"T+0 to T+2h", color:"#5B4B8A", title:"Restore Tier 1 systems",
   systems:["ATC comms interfaces","CCTV","Core network","NOC infrastructure","Data center cooling"], approver:"Bronze team lead"},
  {label:"Phase 2", range:"T+2h to T+4h", color:"#6E5CA8", title:"Restore Tier 2 systems",
   systems:["Check-in infrastructure","Baggage handling","Passenger displays","Ground handling comms"], approver:"Bronze team lead"},
  {label:"Phase 3", range:"T+4h to T+6h", color:"#8A79C4", title:"Restore Tier 3 systems",
   systems:["Wi-Fi","Office IT","Retail systems"], approver:"Bronze team lead"},
  {label:"Phase 4", range:"T+6h+", color:"#2E7D32", title:"Full recovery confirmed",
   systems:["Full operations confirmed","DR failback scheduled separately in a low-traffic window"], approver:"Bronze team lead"}
];

/* =========================================================================
   ESCALATION TREE  (lives inside Ch 03)
   status: green = stable path, amber = action required, red = escalate, muted = branch group
   ========================================================================= */
const a = (text, role) => ({ text, role });

const TREE = {
  id:"root", title:SCENARIO, status:"red",
  meta:"Trigger: NOC detects mass service degradation OR Facilities notifies NOC",
  actions:[
    a("Bronze team lead declares P1 internally","Bronze team lead"),
    a("Open IT service status log and begin documenting all affected systems","NOC team"),
    a("Execute Tier 3 IT shutdown immediately, cut Wi-Fi, non-critical office IT, retail systems","NOC team + Infrastructure Lead"),
    a("Switch all Bronze-tier communications to VHF radio, stop using IP telephony","Bronze team lead"),
    a("Alert all Tier 1 system owners (CCTV, ATC interface, Network Lead)","NOC team"),
    a("Confirm data center cooling status and DR failover readiness","Infrastructure Lead"),
    a("Confirm core network backbone status","Network Lead")
  ],
  children:[
    {
      id:"branch-1", title:"Branch 1: Generator response", status:"muted",
      meta:"Generator response paths", actions:[],
      children:[

function TreeNode({node, expanded, toggle}){
  const isOpen = expanded.has(node.id);
  const hasActions = node.actions && node.actions.length > 0;
  const hasChildren = node.children && node.children.length > 0;
  const dotTitle = {green:"Stable path", amber:"Action required", red:"Escalate", muted:"Branch"}[node.status] || "";
  return (
    <div className="node">
      <div className="node-card">
        <div className="node-head" onClick={() => toggle(node.id)}>
          <span className={"dot " + node.status} title={dotTitle} />
          <div className="node-titlewrap">
            <div className="node-title">{node.title}</div>
            {node.meta && <div className="node-meta">{node.meta}</div>}
          </div>
          <button
            className={"expand-btn" + (isOpen ? " open" : "")}
            aria-expanded={isOpen}
            aria-label={isOpen ? "Collapse" : "Expand"}
            onClick={(e) => { e.stopPropagation(); toggle(node.id); }}
          >{isOpen ? "−" : "+"}</button>
        </div>
        <div className={"node-drawer" + (isOpen ? " open" : "")}>
          <div className="node-body">
            {hasActions && <div className="actions-label">IT ACTIONS</div>}
            {hasActions && node.actions.map((act,i) => <ActionRow key={i} action={act} />)}
            {hasChildren && <div className="children-label">WHAT-IF BRANCHES</div>}
            {hasChildren &&
              <div className="children">
                {node.children.map(c => <TreeNode key={c.id} node={c} expanded={expanded} toggle={toggle} />)}
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

function EscalationTree(){
  const [expanded, setExpanded] = useState(() => new Set());
  const toggle = useCallback((id) => {
    setExpanded(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }, []);
  return (
    <div>
      <div className="tree-sub-label">ESCALATION TREE</div>
      <div className="tree-title">Escalation tree: {SCENARIO}</div>
      <p className="tree-intro">Each node is a decision point in the IT response. Click the plus button to expand a node and see the IT actions, responsible roles, and contacts, then drill into the what-if branches beneath it. Everything starts collapsed.</p>
      <div className="tree-legend">
        <span className="legend-item"><span className="dot green" /> Stable path</span>
        <span className="legend-item"><span className="dot amber" /> Action required</span>
        <span className="legend-item"><span className="dot red" /> Escalate</span>
      </div>
      <div className="tree-controls">
        <button className="tree-btn" onClick={() => setExpanded(new Set(ALL_IDS))}>Expand all</button>
        <button className="tree-btn" onClick={() => setExpanded(new Set())}>Collapse all</button>
      </div>
      <TreeNode node={TREE} expanded={expanded} toggle={toggle} />
    </div>
  );
}

const COMPONENTS = {
  detection: DetectionCards,
  triage: TriageChecklist,
  severity: SeverityLevels,
  owners: OwnerCards,
  recovery: RecoveryTimeline,
  tree: EscalationTree
};

function ChapterBlock({block}){
  switch(block.t){
    case "label": return <div className="section-label">{block.text}</div>;
    case "h":     return <div className="block-h">{block.text}</div>;
    case "p":     return <p className="block-p" dangerouslySetInnerHTML={{__html:block.text}} />;
    case "note":  return <div className="note-box">{block.text}</div>;
    case "ul":
      return (
        <ul className="block-ul">
          {block.items.map((it,i) => <li key={i} dangerouslySetInnerHTML={{__html:it}} />)}
        </ul>
      );
    case "component": {
      const C = COMPONENTS[block.name];
      return C ? <C /> : null;
    }
    default: return null;
  }
}

function ChapterPanel({chapter}){
  return (
    <div className="main-inner">
      <div className="page-eyebrow">CHAPTER {chapter.num}</div>
      <h1 className="page-title">{chapter.title}</h1>
      <div className="scenario-badge">Scenario: {SCENARIO}</div>
      <div className="card">
        {chapter.blocks.map((b,i) => <ChapterBlock key={i} block={b} />)}
      </div>
    </div>
  );
}

function Sidebar({activeId, setView, open}){
  return (
    <nav className={"sidebar" + (open ? " open" : "")}>
      <div className="sidebar-section-label">PLAYBOOK CHAPTERS</div>
      {CHAPTERS.map(ch => (
        <div
          key={ch.id}
          className={"nav-item" + (activeId === ch.id ? " active" : "")}
          onClick={() => setView(ch.id)}
        >
          <span className="nav-num">{ch.num}</span>
          <span>{ch.title}</span>
        </div>
      ))}
    </nav>
  );
}

function GlossaryModal({onClose}){
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Glossary</h2>
          <button className="modal-close" onClick={onClose} aria-label="Close glossary">{"×"}</button>
        </div>
        <div className="modal-body">
          {GLOSSARY.map(([acro, def],i) =>
            <div className="glossary-term" key={i}>
              <div className="glossary-acro">{acro}</div>
              <div className="glossary-def">{def}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TopBar({onMenu, onGlossary}){
  return (
    <header className="topbar">
      <button className="hamburger" onClick={onMenu} aria-label="Toggle navigation">{"☰"}</button>
      <div className="topbar-left">
        <span className="app-name">Incident Response Playbook</span>
      </div>
      <div className="topbar-center">DUBAI AIRPORTS x BCG</div>
      <div className="topbar-right">
        <span className="scenario-pill">{SCENARIO}</span>
        <button className="glossary-btn" onClick={onGlossary}>Glossary</button>
      </div>
    </header>
  );
}

function App(){
  const [activeId, setActiveId] = useState("scenario-overview");
  const [navOpen, setNavOpen] = useState(false);
  const [glossaryOpen, setGlossaryOpen] = useState(false);

  const setView = (id) => { setActiveId(id); setNavOpen(false); };
  const chapter = CHAPTERS.find(c => c.id === activeId);

  return (
    <div className="app">
      <TopBar onMenu={() => setNavOpen(o => !o)} onGlossary={() => setGlossaryOpen(true)} />
      <div className="body-row">
        <Sidebar activeId={activeId} setView={setView} open={navOpen} />
        <div className={"overlay" + (navOpen ? " show" : "")} onClick={() => setNavOpen(false)} />
        <main className="main">
          <ChapterPanel chapter={chapter} />
        </main>
      </div>
      {glossaryOpen && <GlossaryModal onClose={() => setGlossaryOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
